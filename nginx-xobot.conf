# Nginx Configuration for xo-bot.com
# Place this in /etc/nginx/sites-available/xobot
# Then: sudo ln -s /etc/nginx/sites-available/xobot /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name xo-bot.com www.xo-bot.com;

    # Increase body size limit for file uploads (images, etc.)
    client_max_body_size 100M;

    # Sitemap — static XML from dist (generated at build via scripts/generate-sitemap.mjs)
    location = /sitemap.xml {
        root /var/www/xobot/dist;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    # Serve frontend (React build)
    location / {
        root /var/www/xobot/dist;
        try_files $uri $uri/ /index.html;

        # Scripts: same-origin only (Vite bundles). No third-party script CDNs.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            # Nested locations do not inherit parent add_header — keep CSP on assets too (harmless for non-HTML).
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
        }
    }

    # Inbox SSE (realtime) — must not buffer; long-lived connection
    location = /api/conversations/stream {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Also set body size for API
        client_max_body_size 100M;
        
        # Increase timeouts for long-running AI requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Payment proofs / design-studio are private (served via authenticated API)
    location ~* ^/uploads/.+/(payment-proofs|design-studio)/ {
        return 404;
    }
    location ~* ^/uploads/.*\.pdf$ {
        return 404;
    }

    # Serve uploaded files (product images, etc.)
    location /uploads/ {
        alias /var/www/xobot/backend/uploads/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public";
    }
}

